name: Regenerate compatibility fixtures

on:
  push:
    branches:
      - tmp/compat-fixtures-20260911

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: "3.13.3"
      - name: Resolve and regenerate fixtures
        shell: bash
        run: |
          for fixture in fixtures/freezed_app fixtures/riverpod_app; do
            (
              cd "$fixture"
              dart pub get
              dart run build_runner build --delete-conflicting-outputs
            )
          done
      - name: Commit regenerated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             fixtures/freezed_app/pubspec.lock             fixtures/freezed_app/lib/model.freezed.dart             fixtures/freezed_app/lib/serializable.freezed.dart             fixtures/freezed_app/lib/serializable.g.dart             fixtures/riverpod_app/pubspec.lock             fixtures/riverpod_app/lib/model.freezed.dart
          if git diff --cached --quiet; then
            echo "No regenerated files changed"
            exit 0
          fi
          git commit -m "chore: regenerate current compatibility fixtures"
          git push origin "HEAD:$GITHUB_REF_NAME"
