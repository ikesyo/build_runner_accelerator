name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-signing-helpers:
    name: Release signing helpers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Ed25519 key normalization
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  dart-package:
    name: Dart ${{ matrix.sdk }} (${{ matrix.resolution }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: '3.11.0'
            resolution: downgrade
          - sdk: '3.13.3'
            resolution: upgrade
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ runner.arch }}-${{ matrix.sdk }}-${{ matrix.resolution }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ runner.arch }}-${{ matrix.sdk }}-
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}
      - name: Check fixture lockfiles
        if: matrix.resolution == 'upgrade'
        run: python3 scripts/sync_release_metadata.py --check
      - name: Dart package checks
        shell: bash
        run: |
          dart pub ${{ matrix.resolution }}
          dart format --output=none --set-exit-if-changed lib bin test tool
          dart analyze lib bin test tool
          dart test --compiler=source
      - name: Validate publish package
        if: matrix.resolution == 'upgrade'
        run: dart pub publish --dry-run

  rust:
    name: Rust unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # 1.98.1
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check
      - name: Rust unit tests
        run: cargo test --locked --manifest-path rust/Cargo.toml

  integration-baseline:
    name: 'Integration: baseline smoke'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-worker
        with:
          cache-scope: integration-baseline
          cache-inputs: |
            pubspec.lock
            fixtures/**/pubspec.lock
            rust/Cargo.lock
            scripts/smoke.sh
            scripts/watch_smoke.sh
          setup-rust: 'true'
          build-frontend: 'true'
      - name: Run baseline smoke
        env:
          PUB_CACHE: ${{ github.workspace }}/.pub-cache
          SMOKE_SKIP_RUST_TESTS: '1'
        run: bash scripts/smoke.sh
      - name: Run generic watch smoke
        run: bash scripts/watch_smoke.sh

  integration-trigger:
    name: 'Integration: trigger builder'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-worker
        with:
          cache-scope: integration-trigger
          cache-inputs: |
            pubspec.lock
            fixtures/**/pubspec.lock
            rust/Cargo.lock
            scripts/correctness_trigger_builder.sh
            scripts/worker.sh
          setup-rust: 'true'
          build-frontend: 'true'
      - name: Prime trigger-builder dependencies
        shell: bash
        run: |
          (cd fixtures/trigger_builder_app && dart --suppress-analytics pub get)
      - parallel:
          - name: Trigger correctness (detection and generated chain)
            shell: bash
            env:
              PUB_GET_OFFLINE: '1'
              TRIGGER_CASE_GROUP: core
            run: bash scripts/correctness_trigger_builder.sh
          - name: Trigger correctness (optional, deletion, rename)
            shell: bash
            env:
              PUB_GET_OFFLINE: '1'
              TRIGGER_CASE_GROUP: lifecycle
            run: bash scripts/correctness_trigger_builder.sh
          - name: Trigger correctness (config and failure recovery)
            shell: bash
            env:
              PUB_GET_OFFLINE: '1'
              TRIGGER_CASE_GROUP: recovery
            run: bash scripts/correctness_trigger_builder.sh

  integration-arbitrary:
    name: 'Integration: arbitrary builder'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-worker
        with:
          cache-scope: integration-arbitrary
          cache-inputs: |
            pubspec.lock
            fixtures/**/pubspec.lock
            rust/Cargo.lock
            scripts/correctness_arbitrary_builder.sh
            scripts/worker.sh
          setup-rust: 'true'
          build-frontend: 'true'
      - name: Prime arbitrary-builder dependencies
        shell: bash
        run: |
          (cd fixtures/arbitrary_builder_app && dart --suppress-analytics pub get)
      - parallel:
          - name: Arbitrary correctness (output lifecycle)
            shell: bash
            env:
              PUB_GET_OFFLINE: '1'
              CASE_FILTER: generated-output-delete,input-delete,rename
            run: bash scripts/correctness_arbitrary_builder.sh
          - name: Arbitrary correctness (failure and affected actions)
            shell: bash
            env:
              PUB_GET_OFFLINE: '1'
              CASE_FILTER: failure-recovery,affected-actions,output-conflict
            run: bash scripts/correctness_arbitrary_builder.sh
          - name: Arbitrary correctness (source filters)
            shell: bash
            env:
              PUB_GET_OFFLINE: '1'
              CASE_FILTER: exclude-glob,target-sources,exact-extension
            run: bash scripts/correctness_arbitrary_builder.sh

  integration-fixtures:
    name: 'Integration: built_value and package smoke'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-worker
        with:
          cache-scope: integration-fixtures
          cache-inputs: |
            pubspec.lock
            fixtures/**/pubspec.lock
            rust/Cargo.lock
            scripts/correctness_built_value.sh
            scripts/package_smoke.sh
            scripts/worker.sh
          setup-rust: 'true'
          build-frontend: 'true'
      - parallel:
          - name: built_value compatibility fixture
            shell: bash
            run: bash scripts/correctness_built_value.sh
          - name: Published package smoke
            shell: bash
            run: bash scripts/package_smoke.sh

  integration-json-serializable:
    name: 'Integration: JSON Serializable correctness'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-worker
        with:
          cache-scope: compatibility-mapping
          cache-inputs: |
            fixtures/**/pubspec.lock
            rust/Cargo.lock
            scripts/correctness_*.sh
            scripts/watch_smoke_*.sh
            scripts/worker.sh
          setup-rust: 'true'
          build-frontend: 'true'
      - name: Prime JSON Serializable dependencies
        shell: bash
        run: |
          (cd fixtures/json_serializable_app && dart --suppress-analytics pub get)
      - name: Run JSON Serializable cases (shared baseline)
        shell: bash
        env:
          PUB_GET_OFFLINE: '1'
          CASE_FILTER: generated-output-delete,input-delete,rename,failure,affected-actions,generate-for,builder-options,glob-membership,empty-options
        run: bash scripts/correctness_json_serializable.sh

  integration-json-conditional-dependency:
    name: 'Integration: JSON Serializable conditional dependency'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-worker
        with:
          cache-scope: compatibility-mapping
          cache-inputs: |
            fixtures/**/pubspec.lock
            rust/Cargo.lock
            scripts/correctness_*.sh
            scripts/watch_smoke_*.sh
            scripts/worker.sh
          setup-rust: 'true'
          build-frontend: 'true'
      - name: Prime JSON Serializable dependencies
        shell: bash
        run: |
          (cd fixtures/json_serializable_app && dart --suppress-analytics pub get)
      - name: Run JSON Serializable conditional dependency case
        shell: bash
        env:
          PUB_GET_OFFLINE: '1'
          CASE_FILTER: conditional-dependency
        run: bash scripts/correctness_json_serializable.sh

  current-codegen-compatibility:
    name: Freezed compatibility (lifecycle)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-worker
        with:
          cache-scope: current-codegen-freezed-lifecycle
          cache-inputs: |
            fixtures/freezed_app/pubspec.lock
            rust/Cargo.lock
            scripts/correctness_freezed.sh
            scripts/watch_smoke_freezed.sh
            scripts/worker.sh
          setup-rust: 'true'
          build-frontend: 'true'
      - name: Prime current generator dependencies
        shell: bash
        run: |
          (cd fixtures/freezed_app && dart --suppress-analytics pub get)
      - parallel:
          - name: Freezed correctness (inputs)
            shell: bash
            env:
              PUB_GET_OFFLINE: '1'
            run: |
              for case_name in generated-output-delete no-op; do
                CASE_FILTER="$case_name" bash scripts/correctness_freezed.sh
              done
          - name: Freezed correctness (rename path)
            shell: bash
            env:
              PUB_GET_OFFLINE: '1'
            run: |
              for case_name in input-delete rename; do
                CASE_FILTER="$case_name" bash scripts/correctness_freezed.sh
              done
          - name: Freezed correctness (lifecycle)
            shell: bash
            env:
              PUB_GET_OFFLINE: '1'
            run: |
              for case_name in failure affected-actions; do
                CASE_FILTER="$case_name" bash scripts/correctness_freezed.sh
              done
          - name: Freezed watch smoke
            shell: bash
            env:
              PUB_GET_OFFLINE: '1'
            run: bash scripts/watch_smoke_freezed.sh

  current-codegen-freezed-config:
    name: Freezed compatibility (config)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-worker
        with:
          cache-scope: current-codegen-freezed-config
          cache-inputs: |
            fixtures/freezed_app/pubspec.lock
            rust/Cargo.lock
            scripts/correctness_freezed.sh
            scripts/worker.sh
          setup-rust: 'true'
          build-frontend: 'true'
      - name: Prime current generator dependencies
        shell: bash
        run: |
          (cd fixtures/freezed_app && dart --suppress-analytics pub get)
      - parallel:
          - name: Freezed correctness (dependencies)
            shell: bash
            env:
              PUB_GET_OFFLINE: '1'
            run: |
              for case_name in dependency annotation-removal; do
                CASE_FILTER="$case_name" bash scripts/correctness_freezed.sh
              done
          - name: Freezed correctness (combined and options)
            shell: bash
            env:
              PUB_GET_OFFLINE: '1'
            run: |
              for case_name in combined-output-removal builder-options; do
                CASE_FILTER="$case_name" bash scripts/correctness_freezed.sh
              done
          - name: Freezed correctness (globs and empty options)
            shell: bash
            env:
              PUB_GET_OFFLINE: '1'
            run: |
              for case_name in glob-membership empty-options; do
                CASE_FILTER="$case_name" bash scripts/correctness_freezed.sh
              done

  current-codegen-riverpod:
    name: Riverpod compatibility
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-worker
        with:
          cache-scope: current-codegen-riverpod
          cache-inputs: |
            fixtures/riverpod_app/pubspec.lock
            rust/Cargo.lock
            scripts/correctness_riverpod.sh
            scripts/watch_smoke_riverpod.sh
            scripts/worker.sh
          setup-rust: 'true'
          build-frontend: 'true'
      - name: Prime current generator dependencies
        shell: bash
        run: |
          cd fixtures/riverpod_app
          dart --suppress-analytics pub get
      - parallel:
          - name: Riverpod correctness (no-op and source edit)
            shell: bash
            env:
              PUB_GET_OFFLINE: '1'
            run: |
              for case_name in no-op source-edit; do
                CASE_FILTER="$case_name" bash scripts/correctness_riverpod.sh
              done
          - name: Riverpod correctness (output delete and failure)
            shell: bash
            env:
              PUB_GET_OFFLINE: '1'
            run: |
              for case_name in generated-output-delete failure; do
                CASE_FILTER="$case_name" bash scripts/correctness_riverpod.sh
              done
          - name: Riverpod watch smoke
            shell: bash
            env:
              PUB_GET_OFFLINE: '1'
            run: bash scripts/watch_smoke_riverpod.sh

  compatibility:
    name: Compatibility suite (lifecycle)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-worker
        with:
          cache-scope: compatibility-lifecycle
          cache-inputs: |
            fixtures/**/pubspec.lock
            rust/Cargo.lock
            scripts/correctness_*.sh
            scripts/watch_smoke_*.sh
            scripts/worker.sh
          setup-rust: 'true'
          build-frontend: 'true'
      - parallel:
          - name: "Compatibility: lifetime"
            shell: bash
            run: bash scripts/correctness_lifetime_compatibility.sh
          - name: "Compatibility: optional Builder (demand)"
            shell: bash
            run: |
              for case_name in demand no-demand incremental; do
                CASE_FILTER="$case_name" bash scripts/correctness_optional_builder.sh
              done
          - name: "Compatibility: optional Builder (lifecycle)"
            shell: bash
            run: |
              for case_name in failure delete rename; do
                CASE_FILTER="$case_name" bash scripts/correctness_optional_builder.sh
              done
          - name: "Compatibility: optional and trigger watch"
            shell: bash
            run: |
              bash scripts/watch_smoke_optional_builder.sh
              bash scripts/watch_smoke_trigger_builder.sh

  compatibility-graph:
    name: Compatibility suite (post-process, graph)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-worker
        with:
          cache-scope: compatibility-graph
          cache-inputs: |
            fixtures/**/pubspec.lock
            rust/Cargo.lock
            scripts/correctness_*.sh
            scripts/watch_smoke_*.sh
            scripts/worker.sh
          setup-rust: 'true'
          build-frontend: 'true'
      - parallel:
          - name: "Compatibility: post-process Builder"
            shell: bash
            run: bash scripts/correctness_post_process_builder.sh
          - name: "Compatibility: post-process watch"
            shell: bash
            run: bash scripts/watch_smoke_post_process_builder.sh
          - name: "Compatibility: graph"
            shell: bash
            run: |
              bash scripts/correctness_target_cycle.sh
              bash scripts/correctness_arbitrary_dependency_target.sh
              bash scripts/correctness_applies_builder.sh

  compatibility-mapping:
    name: Compatibility suite (mapping and empty-input)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-worker
        with:
          cache-scope: compatibility-mapping
          cache-inputs: |
            fixtures/**/pubspec.lock
            rust/Cargo.lock
            scripts/correctness_*.sh
            scripts/watch_smoke_*.sh
            scripts/worker.sh
          setup-rust: 'true'
          build-frontend: 'true'
      - name: Prime empty-input mapping dependencies
        shell: bash
        run: |
          (cd fixtures/empty_input_mapping_app && dart --suppress-analytics pub get)
      - parallel:
          - name: "Compatibility: capture mapping"
            shell: bash
            run: bash scripts/correctness_capture_builder.sh
          - name: "Compatibility: multiple mappings"
            shell: bash
            run: bash scripts/correctness_multi_mapping_builder.sh
          - name: "Compatibility: Drift"
            shell: bash
            run: bash scripts/correctness_drift.sh
          - name: "Compatibility: empty-input mapping correctness and watch"
            shell: bash
            env:
              PUB_GET_OFFLINE: '1'
            run: |
              bash scripts/correctness_empty_input_mapping.sh
              bash scripts/watch_smoke_empty_input_mapping.sh

  compatibility-drift-analyzer:
    name: Compatibility suite (Drift analyzer)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-worker
        with:
          cache-scope: compatibility-drift-analyzer
          cache-inputs: |
            fixtures/drift_analyzer_app/pubspec.lock
            rust/Cargo.lock
            scripts/correctness_drift_analyzer.sh
            scripts/watch_smoke_drift_analyzer.sh
            scripts/worker.sh
          setup-rust: 'true'
          build-frontend: 'true'
      - name: Prime Drift analyzer dependencies
        shell: bash
        run: |
          (cd fixtures/drift_analyzer_app && dart --suppress-analytics pub get)
      - parallel:
          - name: "Drift analyzer: core"
            shell: bash
            env:
              PUB_GET_OFFLINE: '1'
              CASE_FILTER: core
            run: bash scripts/correctness_drift_analyzer.sh
          - name: "Drift analyzer: rename and delete"
            shell: bash
            env:
              PUB_GET_OFFLINE: '1'
              CASE_FILTER: rename-delete
            run: bash scripts/correctness_drift_analyzer.sh
          - name: "Drift analyzer: failure and recovery"
            shell: bash
            env:
              PUB_GET_OFFLINE: '1'
              CASE_FILTER: failure
            run: bash scripts/correctness_drift_analyzer.sh
          - name: "Drift analyzer: watch"
            shell: bash
            env:
              PUB_GET_OFFLINE: '1'
            run: bash scripts/watch_smoke_drift_analyzer.sh

  native-build:
    name: Native build (${{ matrix.target_id }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_id: macos-arm64
            runs_on: macos-14
            rust_target: aarch64-apple-darwin
          - target_id: linux-x64
            runs_on: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - target_id: linux-arm64
            runs_on: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - target_id: windows-x64
            runs_on: windows-2022
            rust_target: x86_64-pc-windows-msvc
          - target_id: windows-arm64
            runs_on: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust_target }}-${{ hashFiles('rust/Cargo.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust_target }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # 1.98.1
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.rust_target }}
      - name: Build native frontend
        shell: bash
        run: cargo build --locked --release --manifest-path rust/Cargo.toml --target ${{ matrix.rust_target }}
      - name: Native binary smoke
        shell: bash
        run: |
          binary="rust/target/${{ matrix.rust_target }}/release/build_runner_accelerator"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          if [[ "$RUNNER_OS" != Windows ]]; then chmod +x "$binary"; fi
          "$binary" --version
          "$binary" --help
