# PR budget: 16 CI jobs + 4 reserved for CodeQL/other checks = 20.
# Keep case parallelism inside jobs; see docs/ci.md for coverage and timing rules.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: 23 3 * * 1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      jobs: ${{ steps.classify.outputs.jobs }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: classify
        name: Classify changed paths
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs=',integration-selection,integration-filter-graph,integration-boundaries,integration-settings,integration-settings-watch,integration-output-policies,integration-core,integration-codegen,integration-lifecycle,integration-compilers,integration-builders,native-build,'
          if gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate >"$RUNNER_TEMP/pr-files.json"; then
            # The files endpoint returns at most 3,000 entries even with
            # pagination; treat a capped list as incomplete and keep the
            # full-run default rather than classifying a partial diff.
            # Renames contribute their previous path as well: the lanes in
            # this tree may still reference the old location, so a rename
            # must classify by both identities.
            if [[ $(jq -s 'add | length' "$RUNNER_TEMP/pr-files.json") -lt 3000 ]]; then
              files=$(jq -r '.[] | .filename, (.previous_filename // empty)' "$RUNNER_TEMP/pr-files.json")
              derived=$(printf '%s\n' "$files" | python3 .github/scripts/classify_changes.py "$GITHUB_WORKSPACE") || derived=''
              if [[ "$derived" =~ ^jobs=,[a-z0-9,-]*,$ ]]; then
                jobs=${derived#jobs=}
              fi
            fi
          fi
          printf 'jobs=%s\n' "$jobs" >>"$GITHUB_OUTPUT"

  dart-package:
    name: Dart ${{ matrix.sdk }} (${{ matrix.resolution }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: 3.11.0
            resolution: downgrade
            # The minimum frontend_server_client expects a removed SDK snapshot.
            compiler: source
          - sdk: 3.13.3
            resolution: upgrade
            compiler: kernel
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify workflow dependency lockfile
        if: matrix.resolution == 'upgrade'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.0
          gh actions-lock --verify
      - uses: $/.github/actions/setup-worker
        with:
          cache-scope: dart-package-${{ matrix.resolution }}
          cache-inputs: |
            fixtures/**/pubspec.lock
          dart-version: ${{ matrix.sdk }}
          dependency-resolution: ${{ matrix.resolution }}
          setup-rust: 'true'
          build-frontend: 'true'
      - name: Check fixture lockfiles
        if: matrix.resolution == 'upgrade'
        run: python3 scripts/sync_release_metadata.py --check
      - name: Resolve nested-package fixture before parallel checks
        shell: bash
        run: |
          (cd fixtures/build_filter_app && dart --suppress-analytics pub get)
      - parallel:
          - name: Dart analysis and package tests
            run: |
              if [[ '${{ matrix.resolution }}' == upgrade ]]; then
                dart format --output=none --set-exit-if-changed lib bin test tool
              fi
              dart analyze --fatal-infos lib bin test tool
              dart run build_runner --help
              test_kernel_dir="$RUNNER_TEMP/test-kernels"
              mkdir -p "$test_kernel_dir"
              for helper in asset_deps_cache_process reset_directives_worker; do
                dart compile kernel "test/$helper.dart" -o "$test_kernel_dir/$helper.dill"
              done
              BUILD_RUNNER_ACCELERATOR_TEST_KERNEL_DIR="$test_kernel_dir" \
                dart test --compiler='${{ matrix.compiler }}'
              if [[ '${{ matrix.resolution }}' == upgrade ]]; then
                dart pub publish --dry-run
                python3 scripts/correctness_dependency_window.py --runner 2.15.3 --analyzer 13.3.0
              fi
          - name: Rust/Python checks, SDK lifecycle, and builder transitions
            shell: bash
            run: |
              if [[ '${{ matrix.resolution }}' == upgrade ]]; then
                rustup component add rustfmt clippy
                python3 -m pip install --quiet --disable-pip-version-check PyYAML==6.0.3
                python3 .github/scripts/check_ci.py
                python3 -m unittest discover -s .github/scripts -p 'test_*.py'
                python3 -m unittest discover -s scripts -p 'test_*.py'
                bash scripts/test_verification_pool.sh
                cargo fmt --all --manifest-path rust/Cargo.toml -- --check
                cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings
                cargo test --locked --manifest-path rust/Cargo.toml
              fi
              bash scripts/correctness_sdk.sh --resolution "${{ matrix.resolution }}" --results "$RUNNER_TEMP/sdk-results/${{ matrix.sdk }}/baseline"
              if [[ '${{ matrix.resolution }}' == upgrade ]]; then
                NESTED_PACKAGE_CASE_GROUP=recovery-actions NESTED_PACKAGE_RECOVERY_CASE=builder-transition bash scripts/correctness_nested_packages.sh
              fi
          - name: Pinned runner lifecycle or publication recovery
            shell: bash
            run: |
              if [[ '${{ matrix.resolution }}' == downgrade ]]; then
                bash scripts/correctness_sdk.sh --resolution downgrade --runner 2.17.1 --worker-mode jit --results "$RUNNER_TEMP/sdk-results/${{ matrix.sdk }}/runner-2.17.1"
                NESTED_PACKAGE_CASE_GROUP=default-off bash scripts/correctness_nested_packages.sh
              else
                (cd fixtures/post_process_builder_app && dart --suppress-analytics pub get)
                bash scripts/correctness_commit_recovery.sh
              fi
          - name: Shared parts or dependency window and generic watch
            shell: bash
            run: |
              if [[ '${{ matrix.resolution }}' == downgrade ]]; then
                bash scripts/correctness_shared_parts.sh --resolution downgrade --worker-mode jit --jobs 2 --results "$RUNNER_TEMP/sdk-results/${{ matrix.sdk }}/shared-parts"
              else
                python3 scripts/correctness_dependency_window.py --runner 2.16.0 --analyzer 13.3.0
                bash scripts/watch_smoke.sh
              fi
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: sdk-compatibility-${{ matrix.sdk }}
          path: |
            ${{ runner.temp }}/sdk-results/${{ matrix.sdk }}/**/*.log
            ${{ runner.temp }}/sdk-results/${{ matrix.sdk }}/**/pubspec.lock
            ${{ runner.temp }}/sdk-results/${{ matrix.sdk }}/**/stock-reference.json
          if-no-files-found: ignore

  integration-selection:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.jobs == '' || contains(needs.changes.outputs.jobs, ',integration-selection,')) }}
    name: 'Integration: filter selection and graph'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-worker
        with:
          cache-scope: ${{ github.job }}
          integration-cache: 'true'
          cache-inputs: |
            fixtures/**/pubspec.lock
          build-frontend: 'true'
      - name: Resolve fixture dependencies once before parallel checks
        shell: bash
        run: |
          for fixture in build_filter_app; do
            (cd "fixtures/$fixture" && dart --suppress-analytics pub get)
          done
      - parallel:
          - name: Source selection and nested defaults
            shell: bash
            run: |
              BUILD_FILTER_CASE_GROUP=selection-source bash scripts/correctness_build_filter.sh
              NESTED_PACKAGE_CASE_GROUP=default-on bash scripts/correctness_nested_packages.sh
          - name: Cache selection
            shell: bash
            run: |
              BUILD_FILTER_CASE_GROUP=selection-cache bash scripts/correctness_build_filter.sh
          - name: Package selection and narrow scope
            shell: bash
            run: |
              BUILD_FILTER_CASE_GROUP=selection-packages bash scripts/correctness_build_filter.sh
              NESTED_PACKAGE_CASE_GROUP=narrow bash scripts/correctness_nested_packages.sh
          - name: Globs and nested state recovery
            shell: bash
            run: |
              BUILD_FILTER_CASE_GROUP=glob bash scripts/correctness_build_filter.sh
              NESTED_PACKAGE_CASE_GROUP=recovery-state bash scripts/correctness_nested_packages.sh

  integration-filter-graph:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.jobs == '' || contains(needs.changes.outputs.jobs, ',integration-filter-graph,')) }}
    name: 'Integration: filter resolver, state, and unsupported builders'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-worker
        with:
          cache-scope: ${{ github.job }}
          integration-cache: 'true'
          cache-inputs: |
            fixtures/**/pubspec.lock
          build-frontend: 'true'
      - name: Resolve fixture dependencies once before parallel checks
        shell: bash
        run: |
          for fixture in build_filter_app optional_builder_app post_process_builder_app; do
            (cd "fixtures/$fixture" && dart --suppress-analytics pub get)
          done
      - parallel:
          - name: Resolver
            shell: bash
            run: |
              BUILD_FILTER_CASE_GROUP=resolver bash scripts/correctness_build_filter.sh
          - name: State
            shell: bash
            run: |
              BUILD_FILTER_CASE_GROUP=state bash scripts/correctness_build_filter.sh
          - name: Unsupported optional/post-process and nested boundaries
            shell: bash
            run: |
              BUILD_FILTER_CASE_GROUP=unsupported-optional-post bash scripts/correctness_build_filter.sh
              NESTED_PACKAGE_CASE_GROUP=explicit-cache,boundary bash scripts/correctness_nested_packages.sh
          - name: Unsupported zero/trigger and nested sources/globs
            shell: bash
            run: |
              BUILD_FILTER_CASE_GROUP=unsupported-zero-trigger bash scripts/correctness_build_filter.sh
              NESTED_PACKAGE_CASE_GROUP=source,glob bash scripts/correctness_nested_packages.sh

  integration-boundaries:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.jobs == '' || contains(needs.changes.outputs.jobs, ',integration-boundaries,')) }}
    name: 'Integration: filter watch and boundaries'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-worker
        with:
          cache-scope: ${{ github.job }}
          integration-cache: 'true'
          cache-inputs: |
            fixtures/**/pubspec.lock
          build-frontend: 'true'
      - name: Resolve fixture dependencies once before parallel checks
        shell: bash
        run: |
          for fixture in build_filter_app optional_builder_app post_process_builder_app; do
            (cd "fixtures/$fixture" && dart --suppress-analytics pub get)
          done
      - parallel:
          - name: Source watch
            shell: bash
            run: |
              BUILD_FILTER_CASE_GROUP=watch-source bash scripts/correctness_build_filter.sh
          - name: Cache watch, nested native watch, and failure/cancel recovery
            shell: bash
            run: |
              BUILD_FILTER_CASE_GROUP=watch-cache bash scripts/correctness_build_filter.sh
              NESTED_PACKAGE_CASE_GROUP=watch-native bash scripts/correctness_nested_packages.sh
              NESTED_PACKAGE_CASE_GROUP=recovery-actions NESTED_PACKAGE_RECOVERY_CASE=failure-cancel bash scripts/correctness_nested_packages.sh
          - name: Classification, watch boundary, and runner 2.16.0 / Analyzer 14.5
            shell: bash
            run: |
              BUILD_FILTER_CASE_GROUP=watch-classification bash scripts/correctness_build_filter.sh
              NESTED_PACKAGE_CASE_GROUP=watch-boundary bash scripts/correctness_nested_packages.sh
              python3 scripts/correctness_dependency_window.py --runner 2.16.0 --analyzer 14.5.0
          - name: Routing
            shell: bash
            run: |
              BUILD_FILTER_CASE_GROUP=routing bash scripts/correctness_build_filter.sh

  integration-settings:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.jobs == '' || contains(needs.changes.outputs.jobs, ',integration-settings,')) }}
    name: 'Integration: build configuration'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      SETTINGS_COMPARISON_MODE: aot
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-worker
        with:
          cache-scope: ${{ github.job }}
          integration-cache: 'true'
          cache-inputs: |
            fixtures/**/pubspec.lock
          build-frontend: 'true'
      - name: Resolve fixture dependencies once before parallel checks
        shell: bash
        run: |
          for fixture in settings_builder_app json_serializable_app arbitrary_builder_app; do
            (cd "fixtures/$fixture" && dart --suppress-analytics pub get)
          done
      - parallel:
          - name: Values, default watch, and arbitrary builders
            shell: bash
            run: |
              SETTINGS_CASE_GROUP=values,watch-default bash scripts/correctness_settings.sh
              PUB_GET_OFFLINE=1 bash scripts/correctness_arbitrary_builder.sh
              PUB_GET_OFFLINE=1 bash scripts/correctness_arbitrary_package_target_builder.sh
          - name: Compact flags, reserved/topology watch, and manifest snapshot
            shell: bash
            run: |
              SETTINGS_CASE_GROUP=compact,watch-reserved,watch-topology bash scripts/correctness_settings.sh
              bash scripts/correctness_manifest_snapshot.sh
          - name: Config paths and normalized dot/ancestor watch
            shell: bash
            run: |
              SETTINGS_CASE_GROUP=paths,watch-dot,watch-package bash scripts/correctness_settings.sh
          - name: Config files, nested watch, and obsolete state
            shell: bash
            run: |
              SETTINGS_CASE_GROUP=files,watch-nested bash scripts/correctness_settings.sh
              bash scripts/correctness_upgrade.sh

  integration-settings-watch:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.jobs == '' || contains(needs.changes.outputs.jobs, ',integration-settings-watch,')) }}
    name: 'Integration: configuration watch and AOT'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      SETTINGS_COMPARISON_MODE: aot
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-worker
        with:
          cache-scope: ${{ github.job }}
          integration-cache: 'true'
          cache-inputs: |
            fixtures/**/pubspec.lock
          build-frontend: 'true'
      - name: Resolve fixture dependencies once before parallel checks
        shell: bash
        run: |
          for fixture in settings_builder_app trigger_builder_app post_process_builder_app workspace_json_app arbitrary_builder_app; do
            (cd "fixtures/$fixture" && dart --suppress-analytics pub get)
          done
      - parallel:
          - name: Configuration errors and boundaries
            shell: bash
            run: |
              SETTINGS_CASE_GROUP=errors,boundaries bash scripts/correctness_settings.sh
          - name: Precedence, post-process, arbitrary watch, and compile isolation
            shell: bash
            run: |
              SETTINGS_CASE_GROUP=precedence bash scripts/correctness_settings.sh
              bash scripts/correctness_post_process_builder.sh
              bash scripts/watch_smoke_arbitrary_builder.sh
              python3 scripts/correctness_compile_isolation.py
          - name: JIT/AOT compile and publication recovery
            shell: bash
            # Keep prewarm and compile coverage cold, independent of other lanes.
            env:
              BUILD_RUNNER_ACCELERATOR_CACHE: ${{ runner.temp }}/settings-compile-cold-cache
            run: |
              SETTINGS_CASE_GROUP=compile bash scripts/correctness_settings.sh
          - name: Trigger lifecycle and JSON workspace
            shell: bash
            run: |
              bash scripts/correctness_trigger_builder.sh
              bash scripts/correctness_workspace_json.sh

  integration-output-policies:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.jobs == '' || contains(needs.changes.outputs.jobs, ',integration-output-policies,')) }}
    name: 'Integration: output policies'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      OUTPUT_POLICY_COVERAGE: ${{ github.event_name == 'pull_request' && 'pairwise' || 'full' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-worker
        with:
          cache-scope: ${{ github.job }}
          integration-cache: 'true'
          cache-inputs: |
            fixtures/**/pubspec.lock
          build-frontend: 'true'
      - name: Resolve fixture dependencies once before parallel checks
        shell: bash
        run: |
          for fixture in build_filter_app; do
            (cd "fixtures/$fixture" && dart --suppress-analytics pub get)
          done
      - parallel:
          - name: Source output policies and package smoke
            shell: bash
            run: |
              OUTPUT_POLICY_CASE_GROUP=source bash scripts/correctness_output_policies.sh
              bash scripts/package_smoke.sh
          - name: Cache output policies and scheduler reuse
            shell: bash
            run: |
              OUTPUT_POLICY_CASE_GROUP=cache bash scripts/correctness_output_policies.sh
              bash scripts/correctness_workspace_scheduler_reuse.sh
          - name: Failure recovery and routing
            shell: bash
            run: |
              OUTPUT_POLICY_CASE_GROUP=failure,routing bash scripts/correctness_output_policies.sh
          - name: Runner 2.16.1 / Analyzer 14.5 and config watches
            shell: bash
            run: |
              python3 scripts/correctness_dependency_window.py --runner 2.16.1 --analyzer 14.5.0
              SETTINGS_CASE_GROUP=watch-backslash,watch-named bash scripts/correctness_settings.sh

  integration-core:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.jobs == '' || contains(needs.changes.outputs.jobs, ',integration-core,')) }}
    name: 'Integration: baseline, CLI, and workspace scheduler'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-worker
        with:
          cache-scope: ${{ github.job }}
          integration-cache: 'true'
          cache-inputs: |
            fixtures/**/pubspec.lock
          build-frontend: 'true'
      - name: Resolve fixture dependencies once before parallel checks
        shell: bash
        run: |
          for fixture in json_serializable_app current_json_app arbitrary_builder_app; do
            (cd "fixtures/$fixture" && dart --suppress-analytics pub get)
          done
      - parallel:
          - name: Baseline smoke and single-package scheduler
            shell: bash
            run: |
              SMOKE_SKIP_RUST_TESTS=1 bash scripts/smoke.sh
              bash scripts/correctness_single_package_scheduler.sh
          - name: CLI compatibility
            shell: bash
            run: |
              bash scripts/correctness_cli.sh
          - name: Workspace scheduler
            shell: bash
            run: |
              SCHEDULER_SUBPROBES=0 bash scripts/correctness_workspace_scheduler.sh
          - name: Setup prewarm
            shell: bash
            run: |
              bash scripts/correctness_prewarm.sh

  integration-codegen:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.jobs == '' || contains(needs.changes.outputs.jobs, ',integration-codegen,')) }}
    name: 'Integration: code generators'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-worker
        with:
          cache-scope: ${{ github.job }}
          integration-cache: 'true'
          prepare-integration-cache: 'true'
          cache-inputs: |
            fixtures/**/pubspec.lock
          build-frontend: 'true'
      - name: Resolve fixture dependencies once before parallel checks
        shell: bash
        run: |
          for fixture in freezed_app riverpod_app json_serializable_app empty_input_mapping_app; do
            (cd "fixtures/$fixture" && dart --suppress-analytics pub get)
          done
      - parallel:
          - name: Freezed with one shared baseline
            shell: bash
            run: |
              bash scripts/correctness_freezed.sh
              bash scripts/watch_smoke_empty_input_mapping.sh
            env:
              PUB_GET_OFFLINE: '1'
          - name: Riverpod lifecycle, watch, and multiple mappings
            shell: bash
            run: |
              bash scripts/correctness_riverpod.sh
              bash scripts/watch_smoke_riverpod.sh
              bash scripts/correctness_multi_mapping_builder.sh
            env:
              PUB_GET_OFFLINE: '1'
          - name: JSON Serializable shared baseline, capture mapping, and early catalog
            shell: bash
            run: |
              CASE_FILTER=shared-baseline bash scripts/correctness_json_serializable.sh
              bash scripts/correctness_capture_builder.sh
              bash scripts/correctness_early_catalog.sh
            env:
              PUB_GET_OFFLINE: '1'
          - name: Freezed watch and generic mappings
            shell: bash
            run: |
              bash scripts/watch_smoke_freezed.sh
              PUB_GET_OFFLINE=1 bash scripts/correctness_empty_input_mapping.sh

  integration-lifecycle:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.jobs == '' || contains(needs.changes.outputs.jobs, ',integration-lifecycle,')) }}
    name: 'Integration: lifecycle, publication, and workspace'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-worker
        with:
          cache-scope: ${{ github.job }}
          integration-cache: 'true'
          cache-inputs: |
            fixtures/**/pubspec.lock
          build-frontend: 'true'
      - name: Resolve fixture dependencies once before parallel checks
        shell: bash
        run: |
          for fixture in optional_builder_app post_process_builder_app optional_cleanup_app; do
            (cd "fixtures/$fixture" && dart --suppress-analytics pub get)
          done
      - parallel:
          - name: Optional lifecycle and lifetime
            shell: bash
            run: |
              bash scripts/correctness_optional_builder.sh
              bash scripts/correctness_lifetime_compatibility.sh
              bash scripts/watch_smoke_optional_builder.sh
              bash scripts/watch_smoke_trigger_builder.sh
          - name: Optional cleanup lifecycle
            shell: bash
            run: |
              bash scripts/correctness_optional_cleanup.sh
          - name: Post-process watch and graph
            shell: bash
            run: |
              bash scripts/watch_smoke_post_process_builder.sh
              bash scripts/watch_smoke_optional_cleanup.sh
              bash scripts/correctness_target_cycle.sh
              bash scripts/correctness_arbitrary_dependency_target.sh
              bash scripts/correctness_applies_builder.sh
          - name: Pub workspace
            shell: bash
            run: |
              bash scripts/correctness_workspace.sh

  integration-compilers:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.jobs == '' || contains(needs.changes.outputs.jobs, ',integration-compilers,')) }}
    name: 'Integration: published web compilers'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-worker
        with:
          cache-scope: ${{ github.job }}
          integration-cache: 'true'
          cache-inputs: |
            fixtures/**/pubspec.lock
          build-frontend: 'true'
      - name: Resolve shared output-policy and built_value dependencies
        shell: bash
        run: |
          for fixture in build_filter_app built_value_app; do
            (cd "fixtures/$fixture" && dart --suppress-analytics pub get)
          done
      - parallel:
          - name: dart2js lifecycle
            shell: bash
            run: |
              bash scripts/correctness_web_compilers.sh
          - name: dart2js watch
            shell: bash
            run: |
              bash scripts/watch_smoke_web_compilers.sh
              OUTPUT_POLICY_CASE_GROUP=api bash scripts/correctness_output_policies.sh
          - name: DDC lifecycle
            shell: bash
            run: |
              bash scripts/correctness_web_compilers_ddc.sh
              bash scripts/correctness_built_value.sh
          - name: DDC watch
            shell: bash
            run: |
              bash scripts/watch_smoke_web_compilers_ddc.sh
              OUTPUT_POLICY_CASE_GROUP=modes bash scripts/correctness_output_policies.sh

  integration-builders:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.jobs == '' || contains(needs.changes.outputs.jobs, ',integration-builders,')) }}
    name: 'Integration: Drift, registry, and recovery'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-worker
        with:
          cache-scope: ${{ github.job }}
          integration-cache: 'true'
          cache-inputs: |
            fixtures/**/pubspec.lock
          build-frontend: 'true'
      - name: Resolve fixture dependencies once before parallel checks
        shell: bash
        run: |
          for fixture in drift_analyzer_app post_process_builder_app; do
            (cd "fixtures/$fixture" && dart --suppress-analytics pub get)
          done
      - parallel:
          - name: Drift core and not-shared
            shell: bash
            run: |
              CASE_FILTER=core bash scripts/correctness_drift_analyzer.sh
              bash scripts/correctness_drift_not_shared.sh
          - name: Drift rename and failure
            shell: bash
            run: |
              CASE_FILTER=rename-delete bash scripts/correctness_drift_analyzer.sh
              CASE_FILTER=failure bash scripts/correctness_drift_analyzer.sh
          - name: Drift watches and conventional generator
            shell: bash
            run: |
              bash scripts/watch_smoke_drift_analyzer.sh
              bash scripts/watch_smoke_drift_not_shared.sh
              bash scripts/correctness_drift.sh
          - name: Registry contracts and watch
            shell: bash
            run: |
              bash scripts/correctness_registry_override.sh
              bash scripts/correctness_registry_builder.sh
              bash scripts/watch_smoke_registry_override.sh

  native-build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.jobs == '' || contains(needs.changes.outputs.jobs, ',native-build,')) }}
    name: Native build (${{ matrix.target_id }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request' && '[
            {
              "target_id": "macos-arm64",
              "runs_on": "macos-15",
              "rust_target": "aarch64-apple-darwin"
            },
            {
              "target_id": "linux-x64",
              "runs_on": "ubuntu-24.04",
              "rust_target": "x86_64-unknown-linux-gnu"
            },
            {
              "target_id": "windows-x64",
              "runs_on": "windows-2022",
              "rust_target": "x86_64-pc-windows-msvc"
            }
          ]' || '[
            {
              "target_id": "macos-arm64",
              "runs_on": "macos-15",
              "rust_target": "aarch64-apple-darwin"
            },
            {
              "target_id": "linux-x64",
              "runs_on": "ubuntu-24.04",
              "rust_target": "x86_64-unknown-linux-gnu"
            },
            {
              "target_id": "linux-arm64",
              "runs_on": "ubuntu-24.04-arm",
              "rust_target": "aarch64-unknown-linux-gnu"
            },
            {
              "target_id": "windows-x64",
              "runs_on": "windows-2022",
              "rust_target": "x86_64-pc-windows-msvc"
            },
            {
              "target_id": "windows-arm64",
              "runs_on": "windows-11-arm",
              "rust_target": "aarch64-pc-windows-msvc"
            }
          ]') }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Cache Cargo downloads
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v6.1.0
        with: &native-cargo-download-cache
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore Cargo downloads
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6.1.0
        with: *native-cargo-download-cache
      - name: Cache Rust build artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v6.1.0
        with: &native-rust-build-cache
          path: rust/target
          key: rust-target-v1-${{ runner.os }}-${{ runner.arch }}-1.98.1-release-${{ matrix.rust_target }}-${{ hashFiles('rust/**', '!rust/target/**', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-target-v1-${{ runner.os }}-${{ runner.arch }}-1.98.1-release-${{ matrix.rust_target }}-
      - name: Restore Rust build artifacts
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6.1.0
        with: *native-rust-build-cache
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.98.1
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.rust_target }}
      - name: Build native frontend
        shell: bash
        run: cargo build --locked --release --manifest-path rust/Cargo.toml --target ${{ matrix.rust_target }}
      - name: Verify Windows compiler-config ACL
        if: runner.os == 'Windows'
        shell: bash
        run: >-
          cargo test --locked --manifest-path rust/Cargo.toml --target ${{ matrix.rust_target }}
          compiler_config_has_protected_owner_acl_and_exclusive_creation
      - name: Native binary smoke
        shell: bash
        run: |
          binary="rust/target/${{ matrix.rust_target }}/release/build_runner_accelerator"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          if [[ "$RUNNER_OS" != Windows ]]; then chmod +x "$binary"; fi
          "$binary" --version
          "$binary" --help
      - uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: 3.13.3
      - name: Resolve package dependencies before parallel checks
        shell: bash
        run: |
          dart pub get
      - parallel:
          - name: Shared cache generation and pack lifecycle
            shell: bash
            run: |
              dart test --compiler=source --timeout 2m \
                test/indexed_blob_generation_test.dart \
                test/indexed_blob_store_test.dart \
                test/packed_analysis_byte_store_test.dart
          - name: Verify packaged distribution with a Dart-only consumer
            shell: bash
            run: |
              binary="rust/target/${{ matrix.rust_target }}/release/build_runner_accelerator"
              extension=tar.gz
              if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; extension=zip; fi
              python3 scripts/package_frontend.py --binary "$binary" --target '${{ matrix.target_id }}' --output dist \
                --evidence 'distribution-results/${{ matrix.target_id }}'
              python3 scripts/distribution_e2e.py --dart "$(command -v dart)" --target '${{ matrix.target_id }}' \
                --archive "dist/build_runner_accelerator-${{ matrix.target_id }}.$extension" \
                --results 'distribution-results/${{ matrix.target_id }}'
          - name: Normal-builder AOT lifecycle or runner 2.15.3 / Analyzer 14.5
            if: matrix.target_id == 'macos-arm64' || matrix.target_id == 'linux-x64'
            shell: bash
            run: |
              if [[ '${{ matrix.target_id }}' == macos-arm64 ]]; then
                BUILD_RUNNER_ACCELERATOR_BIN="$PWD/rust/target/${{ matrix.rust_target }}/release/build_runner_accelerator" \
                  DART_BIN="$(command -v dart)" \
                  python3 scripts/correctness_sdk.py --resolution upgrade --runner 2.17.1 --worker-mode aot \
                  --results "$RUNNER_TEMP/runner-2.17.1-aot"
              else
                python3 scripts/correctness_dependency_window.py \
                  --frontend "$PWD/rust/target/${{ matrix.rust_target }}/release/build_runner_accelerator" \
                  --runner 2.15.3 --analyzer 14.5.0
              fi
          - name: Shared-part AOT or conditional dependency lifecycle
            if: matrix.target_id == 'macos-arm64' || matrix.target_id == 'linux-x64'
            shell: bash
            run: |
              if [[ '${{ matrix.target_id }}' == macos-arm64 ]]; then
                BUILD_RUNNER_ACCELERATOR_BIN="$PWD/rust/target/${{ matrix.rust_target }}/release/build_runner_accelerator" \
                  DART_BIN="$(command -v dart)" \
                  python3 scripts/correctness_shared_parts.py --resolution upgrade --worker-mode aot --jobs 2 \
                  --results "$RUNNER_TEMP/shared-parts-aot"
              else
                BUILD_RUNNER_ACCELERATOR_BIN="$PWD/rust/target/${{ matrix.rust_target }}/release/build_runner_accelerator" \
                  CASE_FILTER=conditional-dependency bash scripts/correctness_json_serializable.sh
              fi
      - uses: actions/upload-artifact@v7.0.2
        if: failure() && (matrix.target_id == 'linux-x64' || matrix.target_id == 'macos-arm64')
        with:
          name: runner-2.17.1-aot-${{ matrix.target_id }}
          path: |-
            ${{ runner.temp }}/runner-2.17.1-aot/**/*.log
            ${{ runner.temp }}/runner-2.17.1-aot/**/pubspec.lock
            ${{ runner.temp }}/runner-2.17.1-aot/**/stock-reference.json

            ${{ runner.temp }}/shared-parts-aot/**
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: distribution-ci-${{ matrix.target_id }}
          path: distribution-results/${{ matrix.target_id }}
          if-no-files-found: error
