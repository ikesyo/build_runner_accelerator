name: Current baseline benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-current-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: stock-default
            lane: stock
            accelerator_jobs: 1
            launcher: 0
          - id: accelerator-default
            lane: accelerator
            accelerator_jobs: default
            launcher: 1
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-worker
        with:
          cache-scope: benchmark-current-${{ matrix.id }}
          cache-inputs: |
            pubspec.lock
            fixtures/riverpod_app/pubspec.lock
            rust/Cargo.lock
            scripts/benchmark_current_baseline.sh
            scripts/benchmark_environment.py
            scripts/generate_application_fixture.py
            scripts/generate_json_serializable_fixture.sh
            scripts/measure_process.py
            scripts/worker.sh
          setup-rust: 'true'
          build-frontend: ${{ matrix.lane == 'accelerator' }}
          frontend-profile: release
      - name: Resolve repository packages
        shell: bash
        run: |
          dart pub get
      - name: Capture benchmark environment
        shell: bash
        env:
          BENCHMARK_ID: ${{ matrix.id }}
          BENCHMARK_LANE: ${{ matrix.lane }}
          BENCHMARK_PARALLELISM: ${{ matrix.accelerator_jobs }}
          RESULTS_DIR: ${{ github.workspace }}/benchmark-results/${{ matrix.id }}
        run: |
          mkdir -p "$RESULTS_DIR"
          python3 scripts/benchmark_environment.py \
            --phase before \
            --output "$RESULTS_DIR/environment-before.json"
      - name: Run current baseline benchmark
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          ACCELERATOR_JOBS: ${{ matrix.accelerator_jobs }}
          ACCELERATOR_LAUNCHER: ${{ matrix.launcher }}
          REPEATS: '3'
          COUNT: '500'
          WORKLOAD: 'application'
          CASES: 'clean no-op one-file broad'
          PUB_GET_OFFLINE: '0'
          BUILD_RUNNER_ACCELERATOR_METRICS: '0'
          RESULTS_DIR: ${{ github.workspace }}/benchmark-results/${{ matrix.id }}
        run: |
          mkdir -p "$RESULTS_DIR"
          bash scripts/benchmark_current_baseline.sh 2>&1 | tee "$RESULTS_DIR/benchmark.log"
      - name: Capture benchmark environment after run
        if: ${{ always() }}
        shell: bash
        env:
          BENCHMARK_ID: ${{ matrix.id }}
          BENCHMARK_LANE: ${{ matrix.lane }}
          BENCHMARK_PARALLELISM: ${{ matrix.accelerator_jobs }}
          RESULTS_DIR: ${{ github.workspace }}/benchmark-results/${{ matrix.id }}
        run: |
          python3 scripts/benchmark_environment.py \
            --phase after \
            --output "$RESULTS_DIR/environment.json" \
            --previous "$RESULTS_DIR/environment-before.json"
      - name: Print benchmark summary
        shell: bash
        env:
          RESULTS_DIR: ${{ github.workspace }}/benchmark-results/${{ matrix.id }}
        run: |
          python3 - "$RESULTS_DIR" <<'PY'
          import json
          import statistics
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          records = []
          for path in sorted(root.glob("*.json")):
              try:
                  record = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue
              if "case" in record and "wall_ms" in record:
                  records.append(record)
          environment = {}
          environment_path = root / "environment.json"
          if environment_path.is_file():
              try:
                  environment = json.loads(environment_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  pass

          def stat(case, key):
              values = [float(record[key]) for record in records
                        if record.get("case") == case]
              return statistics.median(values), min(values), max(values)

          def fmt(value):
              return f"{value:,.0f}"

          def display(value):
              return "unknown" if value in (None, "") else str(value)

          lane = records[0]["lane"]
          parallelism = records[0].get("build_runner_parallelism", "default")
          cpu = environment.get("cpu", {})
          runner = environment.get("runner", {})
          steal = environment.get("cpu_steal", {}).get("percent")
          lines = [
              f"### {lane} ({parallelism})",
              "",
              f"- CPU group: `{display(environment.get('cpu_group'))}`",
              f"- CPU model: {display(cpu.get('model_name'))}",
              f"- vCPU: {display(cpu.get('nproc'))} (host: {display(cpu.get('nproc_all'))})",
              f"- Runner image: {display(runner.get('image_os'))} / {display(runner.get('image_version'))}",
              f"- CPU steal: {display(steal)}%",
              "",
              "| Case | Wall ms (median; min–max) | User ms | Sys ms | Peak RSS KiB |",
              "| --- | ---: | ---: | ---: | ---: |",
          ]
          for case in ("clean", "no-op", "one-file", "broad"):
              wall = stat(case, "wall_ms")
              user = stat(case, "user_ms")
              system = stat(case, "sys_ms")
              rss = stat(case, "maxrss")
              lines.append(
                  f"| {case} | {fmt(wall[0])} ({fmt(wall[1])}–{fmt(wall[2])}) | "
                  f"{fmt(user[0])} | {fmt(system[0])} | {fmt(rss[0])} |"
              )
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(Path.home() / "benchmark-summary.md", "w", encoding="utf-8") as stream:
              stream.write(summary)
          with open(sys.argv[1] + "/summary.md", "w", encoding="utf-8") as stream:
              stream.write(summary)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as stream:
                  stream.write(summary)
          PY
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ always() }}
        with:
          name: benchmark-current-${{ matrix.id }}
          path: ${{ github.workspace }}/benchmark-results/${{ matrix.id }}
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Aggregate benchmark report
    needs: [benchmark]
    if: ${{ needs.benchmark.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: benchmark-current-*
          path: artifacts
          merge-multiple: false
      - name: Build aggregate report
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import statistics
          from pathlib import Path

          root = Path("artifacts")
          records = []
          environments = {}
          for path in root.rglob("environment.json"):
              environments[path.parent] = json.loads(path.read_text())
          for path in root.rglob("results.jsonl"):
              environment = environments.get(path.parent, {})
              for line in path.read_text().splitlines():
                  record = json.loads(line)
                  record["cpu_group"] = environment.get("cpu_group", "unknown")
                  records.append(record)
          cases = ("clean", "no-op", "one-file", "broad")
          for case in cases:
              paired = [r for r in records if r["case"] == case]
              assert len(paired) == 6, (case, len(paired))
              for lane in ("stock", "accelerator"):
                  samples = [r for r in paired if r["lane"] == lane]
                  assert sorted(int(r["repeat"]) for r in samples) == [1, 2, 3]
              assert all(r["exit_code"] == 0 and r["output_count"] == 1001 and int(r["input_count"]) == 1001
                         and r["workload"] == "application" and int(r["feature_count"]) == 500 for r in paired)
              for key in ("output_sha256", "pubspec_lock_sha256", "fixture_sha256"):
                  assert len({r[key] for r in paired}) == 1, (case, key)
              expected_changed = {"no-op": 0, "one-file": 1, "broad": 500}
              if case in expected_changed:
                  assert all(r["changed_output_count"] == expected_changed[case] for r in paired)
          case_hashes = {case: {r["output_sha256"] for r in records if r["case"] == case}.pop()
                         for case in cases}
          assert case_hashes["clean"] == case_hashes["no-op"]
          assert len({case_hashes[case] for case in ("clean", "one-file", "broad")}) == 3
          lines = [
              "# Mixed application benchmark", "",
              "500 feature modules; 1,001 Dart sources and public outputs; 3 repeats per case.",
              "Stock vs ordinary native launcher/default workers. No watch or jobs sweep.",
              "See metadata.txt, lockfiles and per-command logs for exact commands/versions.", "",
              "| CPU group | Lane | Case | Wall ms median (min–max) | User ms | Sys ms | Child RSS KiB |",
              "| --- | --- | --- | ---: | ---: | ---: | ---: |",
          ]
          for group in sorted({r["cpu_group"] for r in records}):
              for lane in ("stock", "accelerator"):
                  for case in cases:
                      samples = [r for r in records if r["cpu_group"] == group
                                 and r["lane"] == lane and r["case"] == case]
                      if not samples:
                          continue
                      values = [r["wall_ms"] for r in samples]
                      resource = " | ".join(f"{statistics.median(r[k] for r in samples):,.0f}"
                                            for k in ("user_ms", "sys_ms", "maxrss"))
                      lines.append(f"| `{group}` | {lane} | {case} | "
                                   f"{statistics.median(values):,.0f} ({min(values):,.0f}–{max(values):,.0f}) | {resource} |")
          lines += ["", "Compare ratios only within matching CPU/environment conditions.",
                    "All 24 measured commands succeeded; public output sets/content match by case.",
                    "Warm setup/AOT compilation and baseline-restoring builds are outside timings.",
                    "Raw JSONL, environment metadata, lockfiles and logs are in the artifacts."]
          report = "\n".join(lines) + "\n"
          Path("benchmark-report.md").write_text(report)
          print(report)
          PY
          cat benchmark-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: benchmark-current-report
          path: benchmark-report.md
          if-no-files-found: error
          retention-days: 14
