name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish.
        required: true
        type: string
      dry_run:
        description: Verify all artifacts with a temporary signing key; do not publish.
        required: true
        default: true
        type: boolean
      source_ref:
        description: Must match the workflow commit; for publication run at the release tag.
        required: false
        type: string

permissions:
  contents: read

env:
  RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  dart-compatibility:
    name: Dart ${{ matrix.sdk }} (${{ matrix.resolution }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: '3.11.0'
            resolution: downgrade
          - sdk: '3.13.3'
            resolution: upgrade
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}
      - name: Dart package checks
        shell: bash
        run: |
          dart pub ${{ matrix.resolution }}
          # Use the development SDK's formatter; older SDKs can format differently.
          if [[ '${{ matrix.resolution }}' == 'upgrade' ]]; then
            dart format --output=none --set-exit-if-changed lib bin test tool
          fi
          dart analyze lib bin test tool
          dart test --compiler=source

      - name: Validate publish package
        if: matrix.resolution == 'upgrade'
        run: dart pub publish --dry-run

  rust-tests:
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    name: Rust unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # 1.98.1
        with:
          toolchain: 1.98.1
      - name: Require exact release source
        id: source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_release_source.py --identity-only
      - name: Rust unit tests
        run: cargo test --locked --manifest-path rust/Cargo.toml

  build-frontend:
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: Build ${{ matrix.target_id }}
    needs: [dart-compatibility, rust-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_id: macos-arm64
            runs_on: macos-15
            rust_target: aarch64-apple-darwin
            archive: tar.gz
          - target_id: linux-x64
            runs_on: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - target_id: linux-arm64
            runs_on: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - target_id: windows-x64
            runs_on: windows-2022
            rust_target: x86_64-pc-windows-msvc
            archive: zip
          - target_id: windows-arm64
            runs_on: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.runs_on }}
    env:
      RUST_TARGET: ${{ matrix.rust_target }}
      TARGET_ID: ${{ matrix.target_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # 1.98.1
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.rust_target }}
      - name: Read release version
        shell: bash
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1)
          frontend_version=$(sed -n "s/^const buildRunnerAcceleratorVersion = '\(.*\)';/\1/p" lib/src/frontend_binary_resolver.dart)
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -n 1)
          if [[ "${RELEASE_TAG#v}" != "$version" ]]; then
            echo "tag version ${RELEASE_TAG#v} does not match pubspec version $version" >&2
            exit 1
          fi
          if [[ "$frontend_version" != "$version" || "$cargo_version" != "$version" ]]; then
            echo "version mismatch: pubspec=$version frontend=$frontend_version cargo=$cargo_version" >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build Rust frontend
        shell: bash
        run: cargo build --locked --release --manifest-path rust/Cargo.toml --target "$RUST_TARGET"
      - name: Native binary smoke
        shell: bash
        run: |
          binary="rust/target/$RUST_TARGET/release/build_runner_accelerator"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          "$binary" --version
          "$binary" --help
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.13.3'
      - name: Package archive and verify Dart-only consumer
        shell: bash
        run: |
          binary="rust/target/$RUST_TARGET/release/build_runner_accelerator"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          python3 scripts/package_frontend.py --binary "$binary" --target "$TARGET_ID" --output . \
            --evidence "distribution-results/$TARGET_ID"
          python3 scripts/distribution_e2e.py --dart "$(command -v dart)" --target "$TARGET_ID" \
            --archive "build_runner_accelerator-$TARGET_ID.${{ matrix.archive }}" \
            --results "distribution-results/$TARGET_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: distribution-release-${{ matrix.target_id }}
          path: distribution-results/${{ matrix.target_id }}
          if-no-files-found: error
      # Attest the final archive in its producer job, before lossless job transfer.
      # No step after this may rewrite/repack the archive.
      - name: Attest native archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build_runner_accelerator-${{ matrix.target_id }}.${{ matrix.archive }}
          create-storage-record: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target_id }}
          path: build_runner_accelerator-${{ matrix.target_id }}.${{ matrix.archive }}
          if-no-files-found: error

  publish-release:
    name: Verify and publish release
    timeout-minutes: 40
    needs: [rust-tests, build-frontend]
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Require successful exact-commit correctness CI
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_CI_WAIT_SECONDS: '1800'
        run: |
          python3 .github/scripts/check_release_source.py
          cp release-source.json dist/release-source.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source
          path: release-source.json
          if-no-files-found: error
      - name: Read release version
        shell: bash
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1)
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Create release manifest and checksums
        run: |
          python3 scripts/create_release_manifest.py \
            --version "$PACKAGE_VERSION" \
            --source-commit "${{ needs.rust-tests.outputs.source_sha }}" \
            --artifacts-dir dist \
            --output dist/release-manifest.json
          (cd dist && sha256sum *.tar.gz *.zip release-manifest.json release-source.json > SHA256SUMS)
      - name: Sign release manifest
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ (github.event_name != 'workflow_dispatch' || !inputs.dry_run) && secrets.BUILD_RUNNER_ACCELERATOR_ED25519_PRIVATE_KEY || '' }}
        run: |
          umask 077
          trap 'rm -f signing-key.pem signing-key-openssl.pem' EXIT
          if [[ "$RELEASE_DRY_RUN" == true ]]; then
            openssl genpkey -algorithm ED25519 -out signing-key.pem
            openssl pkey -in signing-key.pem -pubout -outform DER \
              | tail -c 32 | base64 -w0 > dist/test-public-key.txt
          else
            test -n "$RELEASE_SIGNING_KEY"
            printf '%s\n' "$RELEASE_SIGNING_KEY" > signing-key.pem
          fi
          python3 .github/scripts/normalize_ed25519_private_key.py \
            signing-key.pem signing-key-openssl.pem
          mv signing-key-openssl.pem signing-key.pem
          expected_public_key=$(awk '
            /^const releaseSigningPublicKeyBase64 =/ { getline; gsub(/[ '\'';]/, ""); print }
          ' lib/src/release_downloader.dart)
          if [[ "$RELEASE_DRY_RUN" == true ]]; then
            expected_public_key=$(cat dist/test-public-key.txt)
          fi
          actual_public_key=$(openssl pkey -in signing-key.pem -pubout -outform DER \
            | tail -c 32 | base64 -w0)
          test "$actual_public_key" = "$expected_public_key"
          openssl pkeyutl -sign -rawin -inkey signing-key.pem \
            -in dist/release-manifest.json -out dist/release-manifest.json.sig
          openssl pkeyutl -sign -rawin -inkey signing-key.pem \
            -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
          rm -f signing-key.pem
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.13.3'
      - name: Verify all final signed artifacts before publication
        run: |
          test_key_args=()
          if [[ "$RELEASE_DRY_RUN" == true ]]; then
            test_key_args+=(--test-public-key dist/test-public-key.txt)
          fi
          python3 scripts/distribution_e2e.py "${test_key_args[@]}" --dart "$(command -v dart)" --target linux-x64 \
            --archive dist/build_runner_accelerator-linux-x64.tar.gz --signed-dist dist --verify-install-only \
            --results distribution-results/production
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: distribution-production
          path: distribution-results/production
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.RELEASE_DRY_RUN == 'true'
        with:
          name: dry-run-signed-distribution
          path: dist
          if-no-files-found: error
      # Signing and final consumer checks above leave these subject bytes unchanged.
      - name: Attest release manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/release-manifest.json
          create-storage-record: false
      - name: Verify all attestations before publication
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ needs.rust-tests.outputs.source_sha }}
        run: |
          python3 .github/scripts/verify_release_attestations.py \
            --dist dist --repo "$GITHUB_REPOSITORY" \
            --source-commit "$EXPECTED_SOURCE" --source-ref "$GITHUB_REF" \
            --results attestation-results/before-publication
      - name: Recheck tag and correctness before publication
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_release_source.py
      - name: Publish GitHub Release
        if: env.RELEASE_DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(
            --title "$RELEASE_TAG"
            --generate-notes
          )
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" --verify-tag dist/* "${release_args[@]}"

      - name: Download and verify published Release subjects before pub.dev
        if: env.RELEASE_DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ needs.rust-tests.outputs.source_sha }}
        run: |
          mkdir release-download
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-download \
            --pattern 'build_runner_accelerator-*.tar.gz' \
            --pattern 'build_runner_accelerator-*.zip' --pattern release-manifest.json
          python3 .github/scripts/verify_release_attestations.py \
            --dist release-download --expected-dist dist --repo "$GITHUB_REPOSITORY" \
            --source-commit "$EXPECTED_SOURCE" --source-ref "$GITHUB_REF" \
            --results attestation-results/after-publication
      - name: Retain attestation verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-attestation-verification
          path: attestation-results
          if-no-files-found: warn

  publish-pub-dev:
    name: Publish package to pub.dev
    needs: publish-release
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev
