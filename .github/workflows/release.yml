name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish.
        required: true
        type: string
permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  dart-compatibility:
    name: Dart ${{ matrix.sdk }} (${{ matrix.resolution }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: '3.11.0'
            resolution: downgrade
          - sdk: '3.13.3'
            resolution: upgrade
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}
      - name: Dart package checks
        shell: bash
        run: |
          dart pub ${{ matrix.resolution }}
          dart format --output=none --set-exit-if-changed lib bin test tool
          dart analyze lib bin test tool
          dart test --compiler=source

      - name: Validate publish package
        if: matrix.resolution == 'upgrade'
        run: dart pub publish --dry-run

  rust-tests:
    name: Rust unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
      - name: Rust unit tests
        run: cargo test --manifest-path rust/Cargo.toml

  build-frontend:
    name: Build ${{ matrix.target_id }}
    needs: [dart-compatibility, rust-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_id: macos-arm64
            runs_on: macos-14
            rust_target: aarch64-apple-darwin
            archive: tar.gz
          - target_id: linux-x64
            runs_on: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - target_id: linux-arm64
            runs_on: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - target_id: windows-x64
            runs_on: windows-2022
            rust_target: x86_64-pc-windows-msvc
            archive: zip
          - target_id: windows-arm64
            runs_on: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.runs_on }}
    env:
      RUST_TARGET: ${{ matrix.rust_target }}
      TARGET_ID: ${{ matrix.target_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}
      - name: Read release version
        shell: bash
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1)
          launcher_version=$(sed -n "s/^const buildRunnerAcceleratorVersion = '\(.*\)';/\1/p" lib/src/launcher.dart)
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -n 1)
          if [[ "${RELEASE_TAG#v}" != "$version" ]]; then
            echo "tag version ${RELEASE_TAG#v} does not match pubspec version $version" >&2
            exit 1
          fi
          if [[ "$launcher_version" != "$version" || "$cargo_version" != "$version" ]]; then
            echo "version mismatch: pubspec=$version launcher=$launcher_version cargo=$cargo_version" >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build Rust frontend
        shell: bash
        run: cargo build --release --manifest-path rust/Cargo.toml --target "$RUST_TARGET"
      - name: Native binary smoke
        shell: bash
        run: |
          binary="rust/target/$RUST_TARGET/release/build_runner_accelerator"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          "$binary" --version
          "$binary" --help
      - name: Package archive
        shell: bash
        run: |
          staging="release/$TARGET_ID"
          mkdir -p "$staging"
          binary="rust/target/$RUST_TARGET/release/build_runner_accelerator"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          cp "$binary" "$staging/"
          printf '%s\n' "$PACKAGE_VERSION" > "$staging/VERSION"
          cp README.md "$staging/README.md"
          if [[ -f LICENSE ]]; then cp LICENSE "$staging/LICENSE"; fi
          if [[ "${{ matrix.archive }}" == tar.gz ]]; then
            tar -C release -czf "build_runner_accelerator-$TARGET_ID.tar.gz" "$TARGET_ID"
          else
            (
              cd release
              7z a -tzip "../build_runner_accelerator-$TARGET_ID.zip" "$TARGET_ID/*"
            )
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target_id }}
          path: build_runner_accelerator-${{ matrix.target_id }}.${{ matrix.archive }}
          if-no-files-found: error

  publish-release:
    name: Publish release
    needs: build-frontend
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Read release version
        shell: bash
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1)
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Create release manifest and checksums
        run: |
          python3 scripts/create_release_manifest.py \
            --version "$PACKAGE_VERSION" \
            --artifacts-dir dist \
            --output dist/release-manifest.json
          (cd dist && sha256sum *.tar.gz *.zip release-manifest.json > SHA256SUMS)
      - name: Sign release manifest
        shell: bash
        env:
          RELEASE_SIGNING_KEY: |
            ${{ secrets.BUILD_RUNNER_ACCELERATOR_ED25519_PRIVATE_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY"
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > signing-key.pem
          python3 .github/scripts/normalize_ed25519_private_key.py \
            signing-key.pem signing-key-openssl.pem
          mv signing-key-openssl.pem signing-key.pem
          expected_public_key=$(awk '
            /^const releaseSigningPublicKeyBase64 =/ { getline; gsub(/[ '\'';]/, ""); print }
          ' lib/src/release_downloader.dart)
          actual_public_key=$(openssl pkey -in signing-key.pem -pubout -outform DER \
            | tail -c 32 | base64 -w0)
          test "$actual_public_key" = "$expected_public_key"
          openssl pkeyutl -sign -rawin -inkey signing-key.pem \
            -in dist/release-manifest.json -out dist/release-manifest.json.sig
          openssl pkeyutl -sign -rawin -inkey signing-key.pem \
            -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
          rm -f signing-key.pem
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(
            --title "$RELEASE_TAG"
            --generate-notes
          )
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* "${release_args[@]}"

  publish-pub-dev:
    name: Publish package to pub.dev
    needs: publish-release
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev
