name: Core verification

on:
  schedule:
    - cron: '0 18 * * *' # 03:00 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core correctness
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      VERIFY_LEVEL: full
      VERIFY_FULL_SUITES: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-worker
        with:
          cache-scope: core
          cache-inputs: |
            pubspec.lock
            fixtures/**/pubspec.lock
            rust/Cargo.lock
            scripts/verify.sh
            scripts/worker.sh
          setup-rust: 'true'
          build-frontend: 'true'
      - name: Run core verification
        shell: bash
        run: bash scripts/verify.sh
