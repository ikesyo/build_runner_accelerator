name: Set up Dart worker
description: Set up the pinned worker SDK, Rust toolchain, cache, and optional frontend build.

inputs:
  cache-scope:
    description: Namespace for the job-specific Pub dependency set.
    required: true
  cache-inputs:
    description: Newline-separated lockfiles and inputs that affect the Pub dependency set.
    required: false
    default: |
      pubspec.yaml
      pubspec.lock
  dart-version:
    description: Optional override for the worker Dart SDK.
    required: false
    default: ''
  dependency-resolution:
    description: Root package resolution (get, downgrade, or upgrade).
    required: false
    default: get
  setup-rust:
    description: Install the repository Rust toolchain.
    required: false
    default: 'true'
  build-frontend:
    description: Build and export BUILD_RUNNER_ACCELERATOR_BIN.
    required: false
    default: 'false'
  frontend-profile:
    description: Rust frontend profile, debug or release.
    required: false
    default: debug
  rust-target:
    description: Optional Rust target triple for the frontend build.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - id: versions
      name: Resolve Dart package dependencies
      shell: bash
      env:
        DART_VERSION_INPUT: ${{ inputs.dart-version }}
        CACHE_INPUTS: ${{ inputs.cache-inputs }}
      run: |
        set -euo pipefail
        source .github/worker-toolchain.env
        dart_version="${DART_VERSION_INPUT:-$DART_WORKER_SDK_VERSION}"
        rust_version=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml | head -n 1)
        [[ -n "$dart_version" ]] || { echo 'worker Dart SDK version is empty' >&2; exit 1; }
        [[ -n "$rust_version" ]] || { echo 'Rust version is missing from rust-toolchain.toml' >&2; exit 1; }
        printf 'dart=%s\n' "$dart_version" >>"$GITHUB_OUTPUT"
        printf 'rust=%s\n' "$rust_version" >>"$GITHUB_OUTPUT"
        printf 'PUB_CACHE=%s/.pub-cache\n' "$GITHUB_WORKSPACE" >>"$GITHUB_ENV"

        # Each scope may resolve a different set of fixtures. Do not let one
        # job publish its partial Pub cache as the union for other jobs.
        files=(pubspec.yaml pubspec.lock)
        shopt -s globstar nullglob
        files+=(fixtures/**/pubspec.yaml)
        while IFS= read -r pattern; do
          [[ -n "$pattern" ]] || continue
          for path in $pattern; do
            [[ -f "$path" ]] && files+=("$path")
          done
        done <<<"$CACHE_INPUTS"
        digest=$(
          printf '%s\n' "${files[@]}" |
            sort -u |
            while IFS= read -r path; do sha256sum "$path"; done |
            sha256sum |
            awk '{print $1}'
        )
        printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"

    - name: Cache Pub downloads
      if: github.ref == 'refs/heads/main'
      uses: actions/cache@v6.1.0
      with:
        path: .pub-cache
        key: pub-v2-${{ inputs.cache-scope }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.dart }}-${{ inputs.dependency-resolution }}-${{ steps.versions.outputs.digest }}
        restore-keys: |
          pub-v2-${{ inputs.cache-scope }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.dart }}-${{ inputs.dependency-resolution }}-
    - name: Restore Pub downloads
      if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v6.1.0
      with:
        path: .pub-cache
        key: pub-v2-${{ inputs.cache-scope }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.dart }}-${{ inputs.dependency-resolution }}-${{ steps.versions.outputs.digest }}
        restore-keys: |
          pub-v2-${{ inputs.cache-scope }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.dart }}-${{ inputs.dependency-resolution }}-

    - name: Cache Cargo downloads
      if: inputs.setup-rust == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}
        restore-keys: |
          cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore Cargo downloads
      if: inputs.setup-rust == 'true' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}
        restore-keys: |
          cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Cache Rust build artifacts
      if: inputs.setup-rust == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache@v6.1.0
      with:
        path: rust/target
        key: rust-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.rust }}-${{ inputs.frontend-profile }}-${{ inputs.rust-target || 'host' }}-${{ hashFiles('rust/**', '!rust/target/**', 'rust-toolchain.toml') }}
        restore-keys: |
          rust-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.rust }}-${{ inputs.frontend-profile }}-${{ inputs.rust-target || 'host' }}-
    - name: Restore Rust build artifacts
      if: inputs.setup-rust == 'true' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v6.1.0
      with:
        path: rust/target
        key: rust-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.rust }}-${{ inputs.frontend-profile }}-${{ inputs.rust-target || 'host' }}-${{ hashFiles('rust/**', '!rust/target/**', 'rust-toolchain.toml') }}
        restore-keys: |
          rust-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.rust }}-${{ inputs.frontend-profile }}-${{ inputs.rust-target || 'host' }}-

    - uses: dart-lang/setup-dart@v1.8.1
      with:
        sdk: ${{ steps.versions.outputs.dart }}
        # The matcher file is relative to setup-dart's own action directory;
        # it is not present when setup-dart is nested in this local action.
        problem-matcher: false

    - name: Restore the shared Pub cache after SDK setup
      shell: bash
      run: |
        printf 'PUB_CACHE=%s/.pub-cache\n' "$GITHUB_WORKSPACE" >>"$GITHUB_ENV"

    - name: Resolve Dart worker dependencies
      shell: bash
      env:
        DEPENDENCY_RESOLUTION: ${{ inputs.dependency-resolution }}
      run: |
        case "$DEPENDENCY_RESOLUTION" in
          get) bash scripts/worker.sh pub-get ;;
          downgrade|upgrade) dart --suppress-analytics pub "$DEPENDENCY_RESOLUTION" ;;
          *) echo 'Invalid dependency-resolution' >&2; exit 2 ;;
        esac

    - if: inputs.setup-rust == 'true'
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.98.1
      with:
        toolchain: ${{ steps.versions.outputs.rust }}
        targets: ${{ inputs.rust-target }}

    - if: inputs.build-frontend == 'true'
      name: Build native frontend
      shell: bash
      env:
        FRONTEND_PROFILE: ${{ inputs.frontend-profile }}
        RUST_TARGET: ${{ inputs.rust-target }}
      run: |
        set -euo pipefail
        args=(--profile "$FRONTEND_PROFILE")
        [[ -n "$RUST_TARGET" ]] && args+=(--target "$RUST_TARGET")
        bash scripts/worker.sh build-frontend "${args[@]}"
