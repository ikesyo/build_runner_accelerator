name: freezed_app
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0

dev_dependencies:
  build_runner: 2.16.1
  build_runner_accelerator_worker:
    path: ../../dart_worker
  freezed: 4.0.1
  json_serializable: 6.14.1

targets:
  $default:
    builders:
      freezed:
        generate_for:
          - lib/**.dart
      json_serializable:
        generate_for:
          - lib/serializable.dart
