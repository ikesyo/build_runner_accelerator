builders:
  producer:
    import: "package:applies_builder_app/applies_builder.dart"
    builder_factories:
      - producer
    build_extensions:
      ".txt":
        - ".produced.txt"
    # Selecting a consumer is the contract of applies_builders; it does not
    # itself establish a phase edge. The consumer intentionally has no
    # required_inputs, so this probe also exercises build_runner's stable
    # ordering when no dependency edge is declared.
    applies_builders:
      - applies_builder_app:consumer
    auto_apply: none
    build_to: source

  consumer:
    import: "package:applies_builder_app/applies_builder.dart"
    builder_factories:
      - consumer
    build_extensions:
      ".produced.txt":
        - ".consumed.txt"
    auto_apply: none
    build_to: source

targets:
  $default:
    sources:
      include:
        - lib/**
    builders:
      applies_builder_app:producer:
        generate_for:
          - lib/**/*.txt
