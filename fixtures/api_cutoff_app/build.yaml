targets:
  $default:
    builders:
      api_cutoff_app:summary:
        generate_for:
          - lib/consumer.dart
      api_cutoff_app:echo:
        generate_for:
          - lib/consumer.dart
      api_cutoff_app:probe:
        generate_for:
          - lib/consumer.dart
      api_cutoff_app:ast:
        generate_for:
          - lib/consumer.dart
      api_cutoff_app:combine:
        generate_for:
          - lib/consumer.summary.txt
builders:
  summary:
    import: "package:api_cutoff_app/builder.dart"
    builder_factories:
      - summaryBuilder
    build_extensions:
      ".dart":
        - ".summary.txt"
    auto_apply: none
    build_to: source
  echo:
    import: "package:api_cutoff_app/builder.dart"
    builder_factories:
      - echoBuilder
    build_extensions:
      ".dart":
        - ".echo.txt"
    auto_apply: none
    build_to: source
  probe:
    import: "package:api_cutoff_app/builder.dart"
    builder_factories:
      - probeBuilder
    build_extensions:
      ".dart":
        - ".probe.txt"
    auto_apply: none
    build_to: source
  ast:
    import: "package:api_cutoff_app/builder.dart"
    builder_factories:
      - astBuilder
    build_extensions:
      ".dart":
        - ".ast.txt"
    auto_apply: none
    build_to: source
  combine:
    import: "package:api_cutoff_app/builder.dart"
    builder_factories:
      - combineBuilder
    build_extensions:
      ".summary.txt":
        - ".combined.txt"
    auto_apply: none
    build_to: source
