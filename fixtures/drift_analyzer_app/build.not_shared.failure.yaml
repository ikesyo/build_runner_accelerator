builders:
  analyzer_probe:
    import: "package:drift_analyzer_app/analyzer_probe.dart"
    builder_factories:
      - analyzerProbe
    build_extensions:
      ".dart":
        - ".drift_analyzer_probe.txt"
      ".drift":
        - ".drift_analyzer_probe.txt"
    required_inputs:
      - ".drift_module.json"
    auto_apply: none
    build_to: source

targets:
  $default:
    sources:
      include:
        - lib/**
    builders:
      drift_dev:drift_dev:
        enabled: false
      drift_dev:analyzer:
        enabled: true
        generate_for:
          - lib/**.dart
          - lib/**.drift
      drift_dev:not_shared:
        enabled: true
        generate_for:
          - lib/database.dart
        options:
          fatal_warnings: true
      drift_analyzer_app:analyzer_probe:
        generate_for:
          include:
            - lib/**.dart
            - lib/**.drift
          exclude:
            - lib/**.drift.dart
