[package]
name = "build_runner_accelerator"
version = "0.11.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
notify = "8.2"
serde = { version = "1.0", features = ["derive", "rc"] }
# BuilderOptions exposes Dart Map insertion order, including nested JSON.
serde_json = { version = "1.0", features = ["preserve_order"] }
