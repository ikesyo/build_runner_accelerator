[package]
name = "build_runner_accelerator"
version = "0.19.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
memchr = "2.8"
blake3 = "1.8"
notify = "8.2"
serde = { version = "1.0", features = ["derive", "rc"] }
# BuilderOptions exposes Dart Map insertion order, including nested JSON.
serde_json = { version = "1.0", features = ["preserve_order"] }

# Shared telemetry code is compiled on every distribution target.
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
# Official OTLP JSON messages bring generated tonic/prost dependencies, without transport features.
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace", "with-serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
