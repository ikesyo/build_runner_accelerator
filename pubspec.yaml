name: build_runner_accelerator
description: A Rust-accelerated frontend for build_runner with a compatible Dart worker.
version: 0.1.0
repository: https://github.com/ikesyo/build_runner_accelerator

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  # Keep the worker on the same execution stack as the current baseline.
  archive: ^4.0.7
  analyzer: ^14.3.0
  build: ^4.0.10
  build_config: ^1.3.2
  build_runner: ^2.16.1
  built_collection: ^5.1.1
  built_value: ^8.10.1
  crypto: ^3.0.6
  cryptography: ^2.7.0
  glob: ^2.1.3
  logging: ^1.3.0
  package_config: ^2.2.0
  path: ^1.9.0
  yaml: ^3.1.2

dev_dependencies:
  test: ^1.26.3

executables:
  build_runner_accelerator: build_runner_accelerator
  generate_builder_manifest: generate_builder_manifest
