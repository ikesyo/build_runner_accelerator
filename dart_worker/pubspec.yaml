name: build_runner_accelerator_worker
description: Repository-only compatibility facade for the build_runner_accelerator worker.
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  # The root package owns the worker implementation and its compatibility
  # bounds. This package only preserves the fixture package URI.
  build_runner_accelerator:
    path: ..

executables:
  generate_builder_manifest: generate_builder_manifest
