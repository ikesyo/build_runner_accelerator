name: fast_build_runner_worker
description: A tiny Dart worker used by the Rust build_runner frontend PoC.
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  # Keep the worker on the same execution stack as the current baseline.
  build: 4.0.10
  build_config: 1.3.2
  build_runner: 2.16.1
  built_collection: ^5.1.1
  built_value: ^8.10.1
  crypto: ^3.0.6
  glob: ^2.1.3
  logging: ^1.3.0
  package_config: ^2.2.0
  path: ^1.9.0
  yaml: ^3.1.2

executables:
  generate_builder_manifest: generate_builder_manifest
